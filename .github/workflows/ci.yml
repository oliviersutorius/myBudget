name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck

  test:
    name: Tests unitaires & intégration (couverture ≥ 90%)
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test -- --coverage --coverageThreshold='{"global":{"branches":90,"functions":90,"lines":90,"statements":90}}'
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  security-audit:
    name: Audit sécurité des dépendances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  e2e:
    name: Tests e2e (Maestro)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      # Workflow managé (pas de dossier android/ versionné, voir .gitignore) :
      # régénéré ici, jetable après le job. Le package `com.mybudget.app`
      # (app.json) doit rester cohérent avec `appId` dans e2e/*.yaml.
      - name: Générer le projet natif Android (expo prebuild)
        run: npx expo prebuild --platform android --no-install
      - name: Construire l'APK debug
        run: cd android && ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Installer Maestro
        run: curl -Ls "https://get.maestro.mobile.dev" | bash
      # KVM (accélération matérielle) : requis par reactivecircus/android-emulator-runner
      # pour démarrer l'émulateur en un temps raisonnable sur un runner ubuntu-latest —
      # voir la doc de l'action.
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Démarrer l'émulateur Android et lancer les flows Maestro
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            export PATH="$PATH:$HOME/.maestro/bin"
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            maestro test e2e/

# Note : la Review N1 (/review) est déclenchée à la demande par le développeur,
# pas automatiquement en CI (choix du projet — voir docs/AGENTS.md).
