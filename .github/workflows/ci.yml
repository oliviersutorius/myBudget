name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck

  test:
    name: Tests unitaires & intégration (couverture ≥ 90%)
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test -- --coverage --coverageThreshold='{"global":{"branches":90,"functions":90,"lines":90,"statements":90}}'
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  security-audit:
    name: Audit sécurité des dépendances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  e2e:
    name: Tests e2e (Maestro)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # `packages: platform-tools` (sans le `tools` par défaut de l'action,
      # voir `packages: tools platform-tools` dans android-actions/setup-android
      # action.yml) : le paquet SDK legacy `tools` (outils historiques
      # `android`/`emulator`/`monitor`, dépréciés depuis 2021) a été retiré du
      # dépôt Google — `sdkmanager tools` échoue désormais avec `Failed to
      # find package 'tools'`, faisant échouer toute l'action (exit code 1)
      # avant même d'atteindre le prebuild/build ci-dessous. Seul
      # `platform-tools` (adb, utilisé plus bas par `adb install`/`logcat`/
      # `exec-out`) est réellement nécessaire ici : `build-tools`/`platforms`
      # manquants pour ce projet sont de toute façon auto-téléchargés par le
      # plugin Gradle Android pendant `assembleRelease`, les licences étant
      # déjà acceptées (`accept-android-sdk-licenses`, défaut de l'action).
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      # Workflow managé (pas de dossier android/ versionné, voir .gitignore) :
      # régénéré ici, jetable après le job. Le package `com.mybudget.app`
      # (app.json) doit rester cohérent avec `appId` dans e2e/*.yaml.
      - name: Générer le projet natif Android (expo prebuild)
        run: npx expo prebuild --platform android --no-install
      # Après le prebuild (pas avant) : la clé de cache est calculée à partir
      # des fichiers gradle du projet natif, générés par ce step précédent —
      # une clé calculée plus tôt (ex. via l'option cache: gradle de
      # actions/setup-java) hasherait des fichiers encore inexistants.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle*') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      # Release plutôt que debug : un APK debug RN/Expo n'embarque pas le
      # bundle JS, il se connecte au serveur Metro — absent en CI, l'app
      # resterait bloquée sans jamais afficher l'écran attendu (constaté en
      # CI). `assembleRelease` embarque le bundle (APK autonome) et reste
      # signé avec le keystore debug par défaut (voir signingConfig dans
      # android/app/build.gradle généré) : pas de configuration de signature
      # à ajouter pour ce test e2e.
      - name: Construire l'APK release
        run: cd android && ./gradlew assembleRelease --no-daemon --stacktrace
      # `>> $GITHUB_PATH` plutôt qu'un `export PATH` dans le step suivant : le
      # `script:` de reactivecircus/android-emulator-runner exécute chaque
      # ligne dans un `sh -c` séparé, un `export` n'y survivrait pas d'une
      # ligne à l'autre (constaté en CI — `maestro: not found`).
      - name: Installer Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      # KVM (accélération matérielle) : requis par reactivecircus/android-emulator-runner
      # pour démarrer l'émulateur en un temps raisonnable sur un runner ubuntu-latest —
      # voir la doc de l'action.
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # reactivecircus/android-emulator-runner@v2 télécharge le SDK Android
      # (dont le paquet `emulator`, ~300 Mo) dans son étape interne « pre »
      # avant même de démarrer l'AVD. Ce téléchargement échoue de façon
      # intermittente côté serveurs Google (« Error on ZipFile unknown
      # archive »), sans lien avec notre code — aucune logique de retry
      # n'est prévue dans l'action elle-même. Wandalen/wretry.action ré-
      # essaie les étapes pre/main/post de l'action encapsulée (ici surtout
      # la « pre », là où l'échec est constaté) en cas de flake réseau.
      #
      # `profile: Nexus 5X` plutôt que `pixel_6` : sur le runner CI partagé
      # (peu de CPU/RAM face à un émulateur + build Gradle simultanés), le
      # profil pixel_6 (plus haute résolution/spec) a provoqué un ANR du
      # Pixel Launcher lui-même (« Pixel Launcher isn't responding »),
      # constaté en plein milieu du rendu de l'app (« Mes comptes » bien
      # affiché derrière le dialogue système) — donc un problème de charge
      # de l'émulateur, pas un bug de l'app. Nexus 5X est le profil plus
      # léger classiquement recommandé pour ce type de flake en CI.
      - name: Démarrer l'émulateur Android et lancer les flows Maestro
        uses: Wandalen/wretry.action@v3.8.0
        with:
          action: reactivecircus/android-emulator-runner@v2
          attempt_limit: 3
          attempt_delay: 15000
          with: |
            api-level: 34
            target: google_apis
            arch: x86_64
            profile: Nexus 5X
            disable-animations: true
            emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
            script: |
              adb install -r android/app/build/outputs/apk/release/app-release.apk
              adb logcat -c
              maestro test e2e/; echo "MAESTRO_EXIT=$?" >> "$GITHUB_ENV"; adb exec-out screencap -p > failure-screenshot.png; adb logcat -d > android-logcat.txt
      # Chaque ligne de `script:` ci-dessus tourne dans un `sh -c` séparé
      # (le `script:` de reactivecircus/android-emulator-runner exécute
      # chaque ligne dans un `sh -c` isolé) : la ligne `maestro test` et les
      # captures qui doivent suivre même en cas d'échec sont donc regroupées
      # sur une seule ligne (`;`, pas `&&`) — sur des lignes séparées, un
      # `maestro test` en échec ferait sortir le script avant elles, on
      # perdrait ces diagnostics justement au moment où ils sont les plus
      # utiles (ticket #22 : 2 runs en échec sur le seul smoke test
      # onboarding.yaml, sans rien d'exploitable dans les logs du job pour
      # en identifier la cause — `--debug-output` de Maestro testé en
      # remplacement, sans effet constaté sur la version installée ici).
      # `adb exec-out screencap` capture l'état de l'écran à l'arrêt du run
      # (dernier flow en échec le cas échéant) ; `adb logcat -d`, les logs
      # Android/app depuis le début du run (voir `adb logcat -c` ci-dessus)
      # — les deux uploadés ci-dessous en cas d'échec (voir step suivant).
      - name: Vérifier le résultat des flows Maestro
        run: exit "${MAESTRO_EXIT:-1}"
      - name: Uploader les diagnostics Maestro/Android en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-e2e-diagnostics
          path: |
            failure-screenshot.png
            android-logcat.txt
          if-no-files-found: warn

# Note : la Review N1 (/review) est déclenchée à la demande par le développeur,
# pas automatiquement en CI (choix du projet — voir docs/AGENTS.md).
