# Parcours principal (ticket #22) : créer un compte → définir un type de
# dépense (niveau 2 « Fixe » + niveau 3 avec un montant) → ajouter un revenu
# sur le mois courant → consulter le récapitulatif mensuel (onglet Budget) et
# vérifier que le montant disponible affiché reflète bien revenu - dépense.
#
# `permissions.notifications: allow` : la création du tout premier compte
# déclenche la demande de permission de notifications (ticket #19), qui
# ouvrirait sinon un dialogue système Android bloquant le flow — pré-accordée
# via ADB pour ne jamais l'affronter ici (voir src/utils/notifications-permission.ts).
# `clearState: true` : garantit un compte vide en local (dev) comme en CI
# (émulateur déjà neuf, mais idempotent en cas de relance).
#
# Lancer avec: maestro test e2e/parcours-principal.yaml
appId: com.mybudget.app
---
- launchApp:
    clearState: true
    permissions:
      notifications: allow
# `extendedWaitUntil` plutôt qu'un simple `assertVisible` sur la première
# assertion seulement : `clearState: true` force un process/premier rendu
# aussi froid qu'un tout premier lancement (voir e2e/onboarding.yaml, même
# constat en CI sur ticket #22) — une fois l'app effectivement affichée,
# les assertions suivantes n'ont plus cette marge à prendre.
- extendedWaitUntil:
    visible: 'Mes comptes'
    timeout: 30000
- assertVisible: "Aucun compte pour l'instant"

# --- Création du compte ---
- tapOn: 'Ajouter un compte'
- tapOn: 'Nom du compte'
- inputText: 'Compte Test'
- tapOn: 'Banque du compte'
- inputText: 'Banque Test'
- hideKeyboard
- tapOn: 'Valider la création du compte'
- assertVisible: 'Compte Test'

# --- Ouverture du compte : tap sur la ligne entière, plus de menu « ⋮ »
# (ticket #67) — ouvre directement sur l'onglet Budget (onglet par défaut de
# EditionCompteScreen, ticket #34). ---
- tapOn: 'Voir le compte Compte Test'
- assertVisible: 'Compte Test'

# --- Onglet Dépenses : type niveau 2 « Loyer » (Fixe) ---
- tapOn: 'Onglet Dépenses'
- tapOn: 'Ajouter un type de dépense — Fixe'
- tapOn: 'Nom du nouveau type de dépense'
- inputText: 'Loyer'
- hideKeyboard
- tapOn: 'Ajouter'
- assertVisible: 'Loyer'

# --- Ligne niveau 3 sous « Loyer », avec un montant ---
- tapOn: 'Ajouter une ligne — Loyer'
- tapOn: 'Nom de la nouvelle ligne'
- inputText: 'Loyer appartement'
- tapOn: 'Montant de la nouvelle ligne'
- inputText: '1200'
- hideKeyboard
- tapOn: 'Ajouter'
# La ligne niveau 3 se déplie automatiquement dès son ajout (voir
# handleAjouterNiveau3, comptes/[id]/edit.tsx) : pas de tap supplémentaire
# nécessaire pour la révéler.
- assertVisible: 'Loyer appartement'

# --- Ticket #64 : un tap sur l'intitulé (pas seulement le chevron) replie/
# déplie la ligne niveau 2 — regex ancrée sur « Replier »/« Déplier »
# (review N1 : un simple `.*type de dépense Loyer.*` matche aussi le bouton
# « ⋮ » adjacent, `Actions pour le type de dépense Loyer (#id)`, rendant le
# tap ambigu). Id du type niveau 2 inconnu à l'avance, d'où le `.*` final. ---
- tapOn: '.*(Replier|Déplier) le type de dépense Loyer.*'
- assertNotVisible: 'Loyer appartement'
- tapOn: '.*(Replier|Déplier) le type de dépense Loyer.*'
- assertVisible: 'Loyer appartement'

# --- Onglet Revenus : revenu sur le mois courant (sélecteur de mois déjà
# positionné dessus par défaut, aucune navigation de mois nécessaire) ---
- tapOn: 'Onglet Revenus'
- tapOn: 'Ajouter un revenu'
- tapOn: 'Libellé du revenu'
- inputText: 'Salaire'
- tapOn: 'Montant du revenu'
- inputText: '2000'
- hideKeyboard
- tapOn: 'Valider l’ajout du revenu'
- assertVisible: 'Salaire'

# --- Onglet Budget : montant disponible du mois courant = 2000 - 1200 =
# 800,00 € (regex plutôt qu'un texte littéral : le séparateur inséré par
# Intl.NumberFormat avant « € » est une espace insécable U+00A0, pas une
# espace classique — voir src/utils/montant.ts) ---
- tapOn: 'Onglet Budget'
- assertVisible: '.*800,00.*'

# --- Détail du mois courant (ticket #63) : le récapitulatif doit lister la
# ligne niveau 3 et le revenu ajoutés plus haut, plus le montant disponible
# en hero. Le mois courant est toujours la première ligne de la liste (les
# mois futurs sont masqués depuis #63) : `index: 0` lève l'ambiguïté du
# sélecteur regex plutôt que de recalculer le libellé du mois courant en
# YAML. ---
- tapOn:
    text: '.*Voir le détail de.*'
    index: 0
# Le groupe niveau 2 « Loyer » est replié par défaut (même comportement que
# Niveau2Ligne côté Dépenses, ajouté après la première maquette du ticket
# #63) : il faut le déplier pour voir la ligne niveau 3 « Loyer
# appartement » en dessous.
- tapOn: 'Déplier le type de dépense Loyer'
- assertVisible: 'Loyer appartement'
- assertVisible: 'Salaire'
- assertVisible: '.*800,00.*'

# --- Onglet Infos : suppression bloquée (ticket #67) — « Compte Test »
# porte encore le type de dépense « Loyer » et le revenu « Salaire » ajoutés
# plus haut, la suppression doit donc être bloquée proactivement, avant même
# la tentative (pas seulement révélée après échec, voir la contrainte de clé
# étrangère de delete-compte.ts). Le bouton « Supprimer » de la popup reste
# visible mais désactivé : le tap sur « Annuler » (pas sur « Supprimer »,
# qui ne ferait rien) referme la popup. ---
- tapOn: 'Onglet Infos'
- tapOn: 'Supprimer le compte'
- assertVisible: '.*Suppression impossible.*'
- tapOn: 'Annuler'
- assertNotVisible: '.*Suppression impossible.*'

# --- Second compte, sans aucune dépense/revenu rattaché : suppression
# réussie, retour automatique à la page d'accueil (router.back(), pas
# d'action utilisateur supplémentaire) et disparition de la liste. `- back`
# (bouton système Android) plutôt qu'un bouton "Retour" dans l'app : l'écran
# compte n'a pas de header (`headerShown: false`, src/app/_layout.tsx),
# navigation retour uniquement via le geste/bouton natif. ---
- back
- tapOn: 'Ajouter un compte'
- tapOn: 'Nom du compte'
- inputText: 'Compte À Supprimer'
- tapOn: 'Banque du compte'
- inputText: 'Banque Test'
- hideKeyboard
- tapOn: 'Valider la création du compte'
- assertVisible: 'Compte À Supprimer'
- tapOn: 'Voir le compte Compte À Supprimer'
- tapOn: 'Onglet Infos'
- tapOn: 'Supprimer le compte'
- assertNotVisible: '.*Suppression impossible.*'
- tapOn: 'Supprimer'
- assertVisible: 'Mes comptes'
- assertNotVisible: 'Compte À Supprimer'
- assertVisible: 'Compte Test'
